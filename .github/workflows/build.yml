name: Bacus Dev RC1 Build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86
            compiler: gcc
            flags: "-m32"
            packages: "gcc-multilib"

          - target: linux-x86_64
            compiler: gcc
            flags: ""
            packages: "gcc"

          - target: linux-arm64
            compiler: aarch64-linux-gnu-gcc
            flags: ""
            packages: "gcc-aarch64-linux-gnu"

          - target: linux-armv6
            compiler: arm-linux-gnueabi-gcc
            flags: "-static -march=armv6 -marm -mfloat-abi=soft"
            packages: "gcc-arm-linux-gnueabi"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Compile
        run: |
          mkdir -p build

          ${{ matrix.compiler }} \
            -std=c11 -Wall -Wextra -Wpedantic -O2 \
            ${{ matrix.flags }} \
            -Iinclude \
            foundation/core/main.c \
            foundation/core/diagnostics.c \
            foundation/config/config.c \
            foundation/log/log.c \
            foundation/memory/memory.c \
            foundation/monitor/resource_monitor.c \
            -o build/bacus-core-${{ matrix.target }}

      - name: Inspect executable
        run: |
          file build/bacus-core-${{ matrix.target }}

      - name: Native tests
        if: matrix.target == 'linux-x86_64'
        run: |
          ./build/bacus-core-linux-x86_64 --version
          ./build/bacus-core-linux-x86_64 --help
          ./build/bacus-core-linux-x86_64 --diagnostics

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: bacus-dev-${{ matrix.target }}
          path: build/bacus-core-${{ matrix.target }}
          if-no-files-found: error